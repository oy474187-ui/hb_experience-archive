<style>

:root{

.window-controls{display:flex;gap:8px;align-items:center;padding:2px 7px 16px}.traffic{width:11px;height:11px;border-radius:50%;display:block}.traffic.red{background:#ff5f57}.traffic.yellow{background:#febc2e}.traffic.green{background:#28c840}.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:650;letter-spacing:-.01em;margin:0 6px 24px;color:#fff}.brand .folder-mark{width:18px;height:14px;border-radius:3px;background:linear-gradient(#6aa8d7,#4a8dbd);position:relative;box-shadow:inset 0 1px rgba(255,255,255,.26)}.brand .folder-mark:before{content:'';position:absolute;left:2px;top:-4px;width:8px;height:5px;border-radius:2px 2px 0 0;background:#74b0da}.brand small{display:none}
.nav-group{margin:0 0 22px}.nav-label{padding:0 10px 7px;color:rgba(255,255,255,.52);font-size:11px;font-weight:650}.nav{display:grid;gap:2px}.muted-group{margin-top:26px}.location-row{display:flex;align-items:center;gap:8px;padding:7px 10px;color:rgba(255,255,255,.48);font-size:11px}.location-dot{width:8px;height:8px;border-radius:50%;background:#7d7d72;box-shadow:inset 0 1px rgba(255,255,255,.18)}.nav button{width:100%;border:0;background:transparent;color:rgba(255,255,255,.79);text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:560;display:grid;grid-template-columns:18px 1fr auto;gap:7px;align-items:center}.nav button:hover{background:rgba(255,255,255,.08);color:#fff}.nav button.active{background:#686860;color:#fff;box-shadow:inset 0 1px rgba(255,255,255,.05)}.nav .n{font-size:9px;color:rgba(255,255,255,.28);font-variant-numeric:tabular-nums}.nav-icon{width:15px;height:15px;display:inline-grid;place-items:center;color:rgba(255,255,255,.74)}.nav-icon svg{width:15px;height:15px;display:block}
.side-foot{position:absolute;left:14px;right:14px;bottom:16px;border-top:1px solid rgba(255,255,255,.08);color:rgba(255,255,255,.38);font-size:10px;line-height:1.5;padding:12px 9px 0}
.main{width:min(calc(100% - 64px),var(--max));margin:0 auto;padding:22px 0 72px}
.topbar{height:42px;display:flex;justify-content:space-between;align-items:center;margin-bottom:46px;padding:0 2px;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line)}.dot{width:7px;height:7px;border-radius:50%;background:#30d158;display:inline-block;margin-right:8px;box-shadow:0 0 14px rgba(48,209,88,.45)}
.hero{max-width:700px;margin-bottom:38px}.hero h1{font-size:clamp(28px,3vw,38px);line-height:1.18;letter-spacing:-.04em;margin:0;font-weight:650}.hero p{display:none}
.rule{height:1px;background:var(--line);margin-bottom:24px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.section-head strong{font-size:14px}.section-head span{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card{position:relative;min-height:196px;padding:21px;border:1px solid rgba(0,0,0,.3);border-radius:12px;background:#2b2b27;cursor:pointer;transition:.18s ease;overflow:hidden;display:flex;flex-direction:column;box-shadow:inset 0 1px rgba(255,255,255,.035)}.card:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.12);background:#30302b}.card.has-image{min-height:330px}.thumb{height:155px;border-radius:8px;background:#1f1f1c center/cover no-repeat;margin:-7px -7px 20px;border:1px solid rgba(0,0,0,.34)}
.meta{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.02em;margin-bottom:14px}.card h2{font-size:22px;line-height:1.24;letter-spacing:-.035em;margin:0 0 12px;font-weight:680}.card p{font-size:14px;line-height:1.62;color:var(--sub);margin:0;max-width:95%}.chev{margin-top:auto;padding-top:24px;color:var(--muted);font-size:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.48);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;transition:.22s;z-index:20}.scrim.open{opacity:1;visibility:visible}
.detail{position:fixed;z-index:30;right:0;top:0;height:100dvh;width:min(760px,62vw);background:rgba(47,47,42,.97);border-left:1px solid var(--line2);box-shadow:-30px 0 90px rgba(0,0,0,.42);backdrop-filter:blur(32px) saturate(135%);-webkit-backdrop-filter:blur(32px) saturate(135%);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:auto}.detail.open{transform:translateX(0)}
.detail-inner{padding:30px 44px 54px}.detail-head{position:sticky;top:0;z-index:2;margin:-30px -44px 0;padding:22px 44px 20px;background:rgba(47,47,42,.88);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:24px}.kicker{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.06em;margin-bottom:9px}.detail h3{font-size:32px;line-height:1.14;letter-spacing:-.04em;margin:0}.close{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.09);color:var(--text);font-size:22px;line-height:1;cursor:pointer;flex:0 0 auto}.close:hover{background:rgba(255,255,255,.15)}
.case{padding-top:8px}.section{padding:32px 0;border-top:1px solid var(--line)}.section:first-child{border-top:0}.label{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:16px}.lead{font-size:21px;line-height:1.58;letter-spacing:-.02em;margin:0;color:var(--text)}.copy{font-size:17px;line-height:1.72;margin:0;color:var(--sub)}
.analysis{display:grid;grid-template-columns:.9fr 1.1fr;gap:38px}.subhead{font-size:12px;color:var(--muted);margin-bottom:12px}.steps{display:grid;gap:16px}.step{display:grid;grid-template-columns:28px 1fr;gap:10px}.num{color:var(--muted);font-size:11px;padding-top:3px}.step strong{font-size:16px;display:block;margin-bottom:4px}.step span{font-size:15px;line-height:1.55;color:var(--sub)}
.output{display:grid;grid-template-columns:.85fr 1.15fr;gap:28px;align-items:start}.output.no-image{grid-template-columns:1fr}.output img{width:100%;max-width:100%;height:auto;max-height:none;object-fit:contain;background:#0d0e11;border:1px solid var(--line);border-radius:14px;display:block;margin:0 auto}.outcome{padding:22px 24px;border-radius:12px;background:#383832;border:1px solid var(--line)}.outcome p{font-size:19px;line-height:1.65;margin:0;color:var(--text)}
@media(max-width:1100px){.app{grid-template-columns:210px 1fr}.main{width:calc(100% - 44px)}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.detail{width:68vw}.analysis,.output{grid-template-columns:1fr}}
@media(max-width:760px){.app{display:block}.sidebar{position:sticky;z-index:10;top:0;height:auto;padding:12px 16px;display:flex;align-items:center;gap:14px;overflow:auto}.brand{margin:0;white-space:nowrap}.brand small,.side-foot{display:none}.nav{display:flex;gap:4px}.nav button{white-space:nowrap;padding:9px 11px}.nav .n{display:none}.main{width:calc(100% - 32px);padding:28px 0 60px}.topbar{margin-bottom:48px}.hero{margin-bottom:38px}.hero h1{font-size:30px}.grid{grid-template-columns:1fr}.card{min-height:190px}.detail{width:100vw;border-left:0}.detail-inner{padding:22px 22px 46px}.detail-head{margin:-22px -22px 0;padding:16px 22px}.detail h3{font-size:30px}.lead{font-size:19px}.copy{font-size:16px}.section{padding:26px 0}.outcome p{font-size:18px}}

.output.has-gallery{grid-template-columns:.8fr 1.2fr!important;}
.output-gallery{display:grid;gap:10px;min-width:0}.output-gallery[data-count="1"]{grid-template-columns:1fr}.output-gallery[data-count="2"],.output-gallery[data-count="3"],.output-gallery[data-count="4"]{grid-template-columns:repeat(2,minmax(0,1fr))}.output-gallery[data-count="3"] .output-gallery-item:first-child{grid-column:1/-1}.output-gallery-item{min-width:0;background:#242420;border:1px solid var(--line);border-radius:12px;padding:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}.output-gallery-resize-box{width:var(--image-scale,100%);max-width:100%;min-width:30%;margin:auto}.output-gallery .output-gallery-resize-box img{width:100%!important;height:auto!important;min-height:0!important;max-height:none!important;object-fit:contain;border:0!important;border-radius:8px;background:#111214;display:block}@media(max-width:1100px){.output.has-gallery{grid-template-columns:1fr!important}}@media(max-width:760px){.output-gallery,.output-gallery[data-count="1"],.output-gallery[data-count="2"],.output-gallery[data-count="3"],.output-gallery[data-count="4"]{grid-template-columns:1fr!important}.output-gallery[data-count="3"] .output-gallery-item:first-child{grid-column:auto}.output-gallery-resize-box{min-width:35%}}

</style>

<style id="v102-output-zoom-section-balance">

const filters=[['all','All Works'],['design','Design'],['system','System'],['build','Build / Tools']];
const icons={all:'▦',design:'◇',system:'▤',build:'⌘'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const rich=(text,boldTerms=[],colorTerms=[])=>{
  const raw=String(text??"");
  const boldMask=Array(raw.length).fill(false);
  const colorMask=Array(raw.length).fill(false);

  const mark=(terms,mask)=>{
    [...new Set((terms||[]).filter(Boolean).map(String))]
      .forEach(term=>{
        let from=0;
        while(term && from<=raw.length-term.length){
          const at=raw.indexOf(term,from);
          if(at<0) break;
          for(let i=at;i<at+term.length;i++) mask[i]=true;
          from=at+Math.max(1,term.length);
        }
      });
  };

  mark(boldTerms,boldMask);
  mark(colorTerms,colorMask);

  let html="", start=0;
  while(start<raw.length){
    const b=boldMask[start], c=colorMask[start];
    let end=start+1;
    while(end<raw.length && boldMask[end]===b && colorMask[end]===c) end++;

    let seg=esc(raw.slice(start,end));
    if(b) seg=`<strong>${seg}</strong>`;
    if(c) seg=`<span class="text-accent">${seg}</span>`;
    html+=seg;
    start=end;
  }
  return html;
};

const processRich=(text)=>{
  const raw=String(text??"");
  const terms=["GA4 Data API","Apps Script","HTML","CTA","KPI","Pipeline","자동","표준화","통합","구현","설계","비교","분석","연결","스와이프","컴포넌트"];
  let h=esc(raw);
  [...terms].sort((a,b)=>b.length-a.length).forEach(term=>{
    const safe=esc(term);
    h=h.replaceAll(safe,`<span class="text-accent">${safe}</span>`);
  });
  return h;
};

function markerGroup(w){
  const cats=String(w.category||'').split(' ');
  if(cats.includes('automation')) return 'automation';
  if(cats.includes('tools')) return 'tools';
  if(cats.includes('system')) return 'system';
  if(cats.includes('workflow')) return 'workflow';
  if(cats.includes('design')) return 'experience';
  return 'experience';
}

let current='all';
function matches(w,f){if(f==='all')return true;const cats=String(w.category||'').split(' ');if(f==='build')return cats.some(c=>['automation','tools','workflow'].includes(c));return cats.includes(f)}
function renderNav(){const nav=document.getElementById('nav');nav.innerHTML=filters.map(([k,n])=>`<button class="${k===current?'active':''}" data-filter="${k}"><span class="nav-icon">${icons[k]||'□'}</span><span>${n}</span><span class="n">${works.filter(w=>matches(w,k)).length}</span></button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{current=b.dataset.filter;renderNav();renderGrid();});}
function renderGrid(){
  const list=works.map((w,i)=>({...w,_i:i})).filter(w=>matches(w,current));
  document.getElementById('count').textContent=list.length;
  document.getElementById('sectionTitle').textContent=filters.find(x=>x[0]===current)?.[1]||'Works';

  document.getElementById('grid').innerHTML=list.map(w=>{
    const img=w.thumb||((w.detailImages||[])[0])||w.detailImage||'';
    const pos=esc(w.thumbPosition||'center center');
    const fit=esc(w.thumbFit||'cover');
    const zoom=Math.max(1,Math.min(1.35,Number(w.thumbZoom)||1));

    return `<article class="card ${img?'has-image':''}" data-index="${w._i}" data-cat="${esc(w.category||'')}">
      ${img?`<div class="thumb">
        <img
          class="thumb-image"
          src="${img}"
          alt="${esc(w.title)} 썸네일"
          draggable="false"
          style="object-position:${pos};object-fit:${fit};transform:scale(${zoom});"
        >
      </div>`:''}
      <div class="meta">
        <span class="shape-marker marker-${markerGroup(w)}" aria-hidden="true"></span>
        <span>${String(w.number||w._i+1).padStart(2,'0')} · ${esc(w.categoryLabel)}</span>
      </div>
      <h2>${esc(w.title)}</h2>
      <p>${esc(w.desc)}</p>
      <div class="chev">›</div>
    </article>`;
  }).join('');

  document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(Number(c.dataset.index)));
}
function openDetail(i){
  const w=works[i];if(!w)return;
  const imgs=(Array.isArray(w.detailImages)&&w.detailImages.length?w.detailImages:(w.detailImage?[w.detailImage]:(w.thumb?[w.thumb]:[]))).filter(Boolean).slice(0,4);
  const sizes=Array.isArray(w.imageSizes)?w.imageSizes.slice(0,imgs.length):[];while(sizes.length<imgs.length)sizes.push(sizes.length===0?(Number(w.imageSize)||100):100);
  const steps=(w.process||[]).slice(0,3);
  document.getElementById('detailContent').innerHTML=`
  <div class="detail-inner">
    <header class="detail-head">
      <div>
        <div class="kicker"><span class="shape-marker marker-${markerGroup(w)}" aria-hidden="true"></span><span>${esc(w.categoryLabel)}</span></div>
        <h3 style="--detail-title-size:${w.title.length>=22?'24px':w.title.length>=18?'27px':w.title.length>=14?'30px':'34px'};--detail-title-size-mobile:${w.title.length>=18?'20px':w.title.length>=14?'22px':'25px'}">${esc(w.title)}</h3>
      </div>
      <button class="close" aria-label="닫기">×</button>
    </header>

    <div class="case">
      <section class="section overview-analysis-section">
        <div class="overview-analysis-grid">
          <div class="overview-column">
            <div class="label">01 OVERVIEW</div>
            <p class="lead primary-copy">${rich(w.context||"",w.contextBoldHighlights,w.contextColorHighlights)}</p>
          </div>
          <div class="analysis-column">
            <div class="label">ANALYSIS</div>
            <div class="analysis-actions">
              ${steps.map(p=>`<div class="action-line"><span class="action-mark" aria-hidden="true"></span><p>${processRich(p.text)}</p></div>`).join('')}
            </div>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="label">02 OUTPUT</div>
        <div class="output ${imgs.length?'has-gallery':'no-image'}">
          <div><p class="copy">${rich(w.toBe||"",w.toBeHighlights,w.toBeColorHighlights)}</p></div>
          ${imgs.length?`<div class="output-gallery" data-count="${imgs.length}">${imgs.map((src,n)=>{const size=Math.max(30,Math.min(100,Number(sizes[n])||100));return `<div class="output-gallery-item" data-zoom-src="${src}" role="button" tabindex="0" aria-label="${esc(w.title)} 결과 이미지 ${n+1} 크게 보기"><div class="output-gallery-resize-box" style="--image-scale:${size}%"><img src="${src}" alt="${esc(w.title)} 결과 이미지 ${n+1}"></div></div>`}).join('')}</div>`:''}
        </div>
      </section>

      <section class="section">
        <div class="label">03 OUTCOME</div>
        <div class="outcome"><p class="primary-copy">${rich(w.desc||"",w.descHighlights,w.descColorHighlights)}</p></div>
      </section>
    </div>
  </div>`;
  document.getElementById('detail').classList.add('open');
  document.getElementById('scrim').classList.add('open');
  document.getElementById('detail').setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  document.querySelector('.close').onclick=closeDetail;
  document.querySelectorAll('.output-gallery-item[data-zoom-src]').forEach(item=>{
    const open=()=>openImageLightbox(item.dataset.zoomSrc,item.querySelector('img')?.alt||'결과 이미지');
    item.onclick=open;
    item.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};
  });
}
function closeDetail(){document.getElementById('detail').classList.remove('open');document.getElementById('scrim').classList.remove('open');document.getElementById('detail').setAttribute('aria-hidden','true');document.body.style.overflow='';}

function openImageLightbox(src,alt='결과 이미지'){
  const box=document.getElementById('imageLightbox');
  const img=document.getElementById('imageLightboxImage');
  img.src=src;img.alt=alt;
  box.classList.add('open');
  box.setAttribute('aria-hidden','false');
}
function closeImageLightbox(){
  const box=document.getElementById('imageLightbox');
  if(!box.classList.contains('open'))return false;
  box.classList.remove('open');
  box.setAttribute('aria-hidden','true');
  document.getElementById('imageLightboxImage').src='';
  return true;
}
document.getElementById('imageLightboxClose').onclick=e=>{e.stopPropagation();closeImageLightbox()};
document.getElementById('imageLightbox').onclick=e=>{
  if(e.target.id==='imageLightbox')closeImageLightbox();
};
document.getElementById('scrim').onclick=closeDetail;
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!closeImageLightbox())closeDetail();
  }
});
renderNav();renderGrid();
</script>
</body></html>
